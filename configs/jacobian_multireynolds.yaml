name: coupled_multireynolds_jacobian_loss

seed: 68
#from the classic configuration, the learning rate for velocity has been increased and the number of neurons for velocity has been increased
#what could be increased is also the number of processors for velocity but since the improvement was limited it has been decided to keep the architecture simpler
#unfeasible, firstly let's just change the lr
# ============================================================
# DATASET
# ============================================================

dataset:
  paths:
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_40R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_80R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_120R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_160R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_180R.mat

  skip_initial: 5


# ============================================================
# SPLIT
# ============================================================

split:
  mode: all_train

  train_fraction: 0.80
  val_fraction: 0.1
  gap: 1


# ============================================================
# TRAINING
# ============================================================

training:
  coupled: true

  num_epochs: 520
  batch_size: 2

  velocity_data_weight: 0.0
  pressure_data_weight: 0.0
  
  data_loss:
    type: mse_topk
    topk_fraction: 0.1
    topk_weight: 0.0

  lr_scheduler:
    type: step
    step_size: 150
    gamma: 0.8

  physics_weight_strategy: fixed

  continuity_weight: 0.0
  momentum_weight: 0.0

  dynamic_weight_learning_rate: 1.0e-4
  enforce_boundary_values: true

  direction_loss:
    enabled: false
  
  newton_loss:
    weight: 1.0
    type: mse_topk
    topk_fraction: 0.10
    topk_weight: 10.0

# ============================================================
# VELOCITY NETWORK
# ============================================================

networks:

  velocity:

    predicts: velocity
    architecture: meshgraphnet
    initialization: zero_output

    features: time
    use_node_type_features: true
    use_physics_features: false
    use_geometry_features: true

    predict_delta: true


    num_neurons: 64

    processor_size: 10

    num_layers_node_processor: 2
    num_layers_edge_processor: 2

    num_layers_node_encoder: 2
    num_layers_edge_encoder: 2
    num_layers_node_decoder: 2

    aggregation: sum

    learning_rate: 5.0e-5


  pressure:

    predicts: pressure
    architecture: bsms
    initialization: zero_output

    features: time
    use_node_type_features: true
    use_physics_features: false
    use_geometry_features: true

    predict_delta: true

    num_neurons: 128

    processor_size: 10

    num_layers_node_processor: 2
    num_layers_edge_processor: 2

    num_layers_node_encoder: 2
    num_layers_edge_encoder: 2
    num_layers_node_decoder: 2

    num_mesh_levels: 5

    aggregation: sum

    learning_rate: 1.0e-5
