name: coupled_multisimulation_justdata_parameters_tuned

seed: 68
# This is the yaml that we will be using for optuna optimization
# ============================================================
# DATASET
# ============================================================

dataset:
  paths:
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_40R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_60R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_80R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_100R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_120R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_140R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_160R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_180R.mat
    - C:/Users/giovanni/.comsol/v64/llmatlab/channel2d_manual_stabilization_200R.mat

  skip_initial: 5


# ============================================================
# SPLIT
# ============================================================

split:
  mode: simulation

  train_simulations: [0, 2, 4, 6, 7]
  val_simulations: [1, 3, 5]
  test_simulations: [8]

# ============================================================
# TRAINING
# ============================================================

training:
  coupled: true

  num_epochs: 520
  batch_size: 2

  velocity_data_weight: 1.0
  pressure_data_weight: 1.0
  
  data_loss:
    type: mse_topk
    topk_fraction: 0.1
    topk_weight: 10.0

  lr_scheduler:
    type: step
    step_size: 150
    gamma: 0.8

  physics_weight_strategy: fixed

  continuity_weight: 0.0
  momentum_weight: 0.0

  dynamic_weight_learning_rate: 1.0e-4
  enforce_boundary_values: true

  direction_loss:
    enabled: false
  
  newton_loss:
    weight: 0.0
    type: mse_topk
    topk_fraction: 0.10
    topk_weight: 0.0

# ============================================================
# VELOCITY NETWORK
# ============================================================

networks:

  velocity:

    predicts: velocity
    architecture: meshgraphnet
    initialization: zero_output

    features: time
    use_node_type_features: true
    use_physics_features: false
    use_geometry_features: true

    predict_delta: true


    num_neurons: 64

    processor_size: 10

    num_layers_node_processor: 2
    num_layers_edge_processor: 2

    num_layers_node_encoder: 2
    num_layers_edge_encoder: 2
    num_layers_node_decoder: 2

    aggregation: sum

    learning_rate: 5.0e-5


  pressure:

    predicts: pressure
    architecture: bsms
    initialization: zero_output

    features: time
    use_node_type_features: true
    use_physics_features: false
    use_geometry_features: true

    predict_delta: true

    num_neurons: 128

    processor_size: 10

    num_layers_node_processor: 2
    num_layers_edge_processor: 2

    num_layers_node_encoder: 2
    num_layers_edge_encoder: 2
    num_layers_node_decoder: 2

    num_mesh_levels: 5

    aggregation: sum

    learning_rate: 1.0e-5
